[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The distribution and the command are "view-json-yaml"; the module is "view_json_yaml", since a module name
# cannot contain a hyphen. Check any replacement name at https://pypi.org/project/<name>/ before publishing.
name = "view-json-yaml"
dynamic = ["version"]
description = "A tkinter viewer for JSON and YAML: folding, status colouring, $ref navigation"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["json", "yaml", "viewer", "openapi", "tkinter", "sbom"]
dependencies = ["ruamel.yaml>=0.17,<1.0"]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "build>=1.0", "twine>=5.0"]

[project.scripts]
view-json-yaml = "view_json_yaml:main"

# [project.urls]
# Homepage = "https://github.com/<you>/view-json-yaml"
# Issues = "https://github.com/<you>/view-json-yaml/issues"

[tool.hatch.version]
# One source of truth: __version__ in view_json_yaml.py.
path = "view_json_yaml.py"

[tool.hatch.build.targets.wheel]
# A single module at the root, so hatchling is told outright rather than left to guess.
only-include = ["view_json_yaml.py"]

[tool.hatch.build.targets.sdist]
include = [
    "view_json_yaml.py",
    "tests/",
    "examples/",
    "README.md",
    "view_json_yaml_spec.md",
    "Makefile",
    "pytest.ini",
    "ruff.toml",
    "requirements.txt",
    "requirements-dev.txt",
]
